<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên Mật Khẩu | Hệ Thống Phân Tích Doanh Thu AI</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- BƯỚC 1: NHẬP EMAIL ĐỂ NHẬN MÃ OTP -->
      <div id="step-1" class="step-container active">
        <div class="auth-header">
          <div class="auth-logo" style="background: linear-gradient(135deg, #f59e0b, #ec4899);">
            <i class="fa-solid fa-key" style="color:#fff;"></i>
          </div>
          <h2>Quên Mật Khẩu?</h2>
          <p>Nhập địa chỉ email của bạn để nhận mã xác thực khôi phục tài khoản (Hạn 15 phút).</p>
        </div>

        <form id="forgot-form">
          <div class="form-group">
            <label for="forgot-email">Địa chỉ Email đã đăng ký</label>
            <div class="input-container">
              <input type="email" id="forgot-email" required placeholder="admin@dacn.vn">
              <i class="fa-solid fa-envelope field-icon"></i>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-auth-submit">
            Gửi Mã Xác Thực OTP <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>

        <div class="auth-footer">
          Nhớ lại mật khẩu rồi? 
          <a href="/static/login.html" class="link-highlight">Quay lại Đăng nhập</a>
        </div>
      </div>

      <!-- BƯỚC 2: NHẬP MÃ OTP & MẬT KHẨU MỚI -->
      <div id="step-2" class="step-container">
        <div class="auth-header">
          <div class="auth-logo" style="background: linear-gradient(135deg, #10b981, #06b6d4);">
            <i class="fa-solid fa-lock-open" style="color:#fff;"></i>
          </div>
          <h2>Đặt Lại Mật Khẩu Mới</h2>
          <p>Nhập mã OTP vừa nhận được và thiết lập mật khẩu bảo mật mới.</p>
        </div>

        <form id="reset-form">
          <input type="hidden" id="reset-email">

          <div class="form-group">
            <label for="otp-code">Mã Xác Thực OTP (6 Số)</label>
            <div class="input-container">
              <input type="text" id="otp-code" required placeholder="123456" maxlength="6" style="letter-spacing: 4px; font-weight:700; font-size:16px;">
              <i class="fa-solid fa-shield-cat field-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="new-password">Mật khẩu mới</label>
            <div class="input-container">
              <input type="password" id="new-password" required placeholder="Tối thiểu 6 ký tự">
              <i class="fa-solid fa-lock field-icon"></i>
              <button type="button" class="btn-toggle-pw" onclick="togglePasswordVisibility('new-password')">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirm-new-password">Xác nhận mật khẩu mới</label>
            <div class="input-container">
              <input type="password" id="confirm-new-password" required placeholder="Nhập lại mật khẩu">
              <i class="fa-solid fa-shield-halved field-icon"></i>
              <button type="button" class="btn-toggle-pw" onclick="togglePasswordVisibility('confirm-new-password')">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-auth-submit" style="background: linear-gradient(135deg, #10b981, #06b6d4);">
            Xác Nhận Đổi Mật Khẩu <i class="fa-solid fa-check"></i>
          </button>
        </form>

        <div class="auth-footer">
          <a href="/static/login.html" class="link-highlight">Quay lại trang Đăng nhập</a>
        </div>
      </div>

    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
