<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập | Hệ Thống Phân Tích Doanh Thu AI</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fa-solid fa-chart-line" style="color:#fff;"></i>
        </div>
        <h2>Chào Mừng Trở Lại</h2>
        <p>Đăng nhập hệ thống phân tích doanh thu & tối ưu kinh doanh</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Địa chỉ Email</label>
          <div class="input-container">
            <input type="email" id="email" required placeholder="admin@dacn.vn" autocomplete="username">
            <i class="fa-solid fa-envelope field-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="input-container">
            <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
            <i class="fa-solid fa-lock field-icon"></i>
            <button type="button" class="btn-toggle-pw" onclick="togglePasswordVisibility('password')" title="Hiện/Ẩn mật khẩu">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" checked>
            <span>Ghi nhớ đăng nhập</span>
          </label>
          <a href="/static/forgot-password.html" class="link-highlight">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-auth-submit">
          Đăng Nhập <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        Chưa có tài khoản quản lý? 
        <a href="/static/register.html" class="link-highlight">Đăng ký ngay</a>
      </div>

      <!-- Khung gợi ý tài khoản mẫu để chấm đồ án -->
      <div class="demo-hint-box">
        <div style="font-weight:700; margin-bottom:4px; color:#fff;">💡 Tài khoản kiểm thử nhanh (Mật khẩu: 123456):</div>
        <div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;">
          <button type="button" class="btn btn-secondary" style="padding:4px 10px; font-size:11px;" onclick="fillDemoAccount('admin')">Admin</button>
          <button type="button" class="btn btn-secondary" style="padding:4px 10px; font-size:11px;" onclick="fillDemoAccount('manager')">Manager</button>
          <button type="button" class="btn btn-secondary" style="padding:4px 10px; font-size:11px;" onclick="fillDemoAccount('sales')">Sales</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
